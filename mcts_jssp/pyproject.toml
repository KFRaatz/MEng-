[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mctsjssp"
version = "1.0.0"
description = "MCTS with fixed and learned rollout distributions for the classical job shop scheduling problem"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torch_geometric>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
mctsjssp = "mctsjssp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that train tiny networks or start worker processes"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::UserWarning"]
